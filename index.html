<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問い合わせ対応ダッシュボード</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--line:#c3c2b7;--border:rgba(11,11,11,.10);--hover:rgba(11,11,11,.05);
  --s-todo:#898781;--s-doing:#2a78d6;--s-wait:#6250d6;--s-done:#1baf7a;
  --on-todo:#fff;--on-doing:#fff;--on-wait:#fff;--on-done:#0b0b0b;
  --crit:#d03b3b;--crit-bg:rgba(208,59,59,.10);--warn-bg:rgba(250,178,25,.18);--warn-ink:#7a5200;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--line:#383835;--border:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --s-doing:#3987e5;--s-wait:#9085e9;--s-done:#199e70;
  --on-done:#fff;--crit:#ec6a6a;--crit-bg:rgba(236,106,106,.14);--warn-bg:rgba(250,178,25,.16);--warn-ink:#fab219;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}
.sub{color:var(--ink2);font-size:12px}
.basedate{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px}
input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover,.kpi:hover{background:var(--hover)}
:focus-visible{outline:2px solid var(--s-doing);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:block}
.kpi[aria-pressed=true]{border-color:var(--s-doing);box-shadow:0 0 0 1px var(--s-doing) inset}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:650;line-height:1.2}
.kpi .n{font-size:11px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
.kpi.alert .l::before{content:"▲ ";color:var(--crit)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 2px}
.hint{font-size:11px;color:var(--muted);margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center;padding:3px 0;cursor:pointer;border-radius:6px}
.brow:hover{background:var(--hover)}
.brow.sel{background:var(--hover);font-weight:600}
.brow .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tot{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:24px}
.seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;min-width:0;overflow:hidden}
.seg:first-child{border-radius:4px 0 0 4px}.seg:last-child{border-radius:0 4px 4px 0}.seg:only-child{border-radius:4px}
.total-bar{height:30px;margin-bottom:6px}
.total-bar .seg{font-size:13px}
.s-todo{background:var(--s-todo);color:var(--on-todo)}.s-doing{background:var(--s-doing);color:var(--on-doing)}
.s-wait{background:var(--s-wait);color:var(--on-wait)}.s-done{background:var(--s-done);color:var(--on-done)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters input[type=search]{min-width:200px}
.count{margin-left:auto;color:var(--ink2);font-size:12px}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:12px;color:var(--ink2);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th[aria-sort=ascending]::after{content:" ↑"}th[aria-sort=descending]::after{content:" ↓"}
tbody tr.main{cursor:pointer}tbody tr.main:hover{background:var(--hover)}
tr.detail td{background:var(--hover);font-size:12px;color:var(--ink2)}
tr.detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
tr.detail dt{color:var(--muted)}tr.detail dd{margin:0;color:var(--ink)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;font-weight:600}
.flag{display:inline-block;padding:0 6px;margin:0 4px 2px 0;border-radius:4px;font-size:11px;white-space:nowrap;font-weight:600}
.f-crit{background:var(--crit-bg);color:var(--crit)}.f-warn{background:var(--warn-bg);color:var(--warn-ink)}.f-info{background:var(--hover);color:var(--ink2)}
.muted{color:var(--muted)}
#chart-next .brow{grid-template-columns:128px 1fr 36px}
.ncat{display:inline-block;padding:0 6px;margin-right:6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--ink2)}
.ncat.p1{background:var(--crit-bg);color:var(--crit)}.ncat.p2{background:var(--warn-bg);color:var(--warn-ink)}
.late{color:var(--crit);font-weight:600}
.empty{padding:32px;text-align:center;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>問い合わせ対応ダッシュボード</h1>
    <div class="sub">全 <span id="n-all"></span> 件 ／ 数字・グラフをクリックすると、下の案件一覧が絞り込まれます</div>
  </div>
  <div class="basedate"><label for="base">基準日</label><input type="date" id="base"><button id="today">今日</button></div>
</header>

<section class="kpis" id="kpis" aria-label="件数サマリー"></section>

<section class="grid">
  <div class="card">
    <h2>対応状況の内訳</h2>
    <div class="hint">全件の状況別。クリックで状況を絞り込み</div>
    <div class="bar total-bar" id="total-bar"></div>
    <div class="legend" id="legend"></div>
    <h2 style="margin-top:14px">担当者別 件数</h2>
    <div class="hint">バーの色は対応状況。行クリックで担当者を絞り込み</div>
    <div id="chart-owner"></div>
  </div>
  <div class="card">
    <h2>分類別 件数</h2>
    <div class="hint">バーの色は対応状況（凡例は左と共通）。行クリックで分類を絞り込み</div>
    <div id="chart-cat"></div>
    <h2 style="margin-top:14px">次の対応 カテゴリ別 件数（未完了）</h2>
    <div class="hint">上から優先度の高い順。行クリックでカテゴリを絞り込み</div>
    <div id="chart-next"></div>
  </div>
</section>

<section class="card">
  <h2>案件一覧</h2>
  <div class="hint">行をクリックすると詳細（判断事項・最終更新・完了日時）を表示。列見出しで並べ替え</div>
  <div class="filters">
    <select id="f-status" aria-label="対応状況"></select>
    <select id="f-cat" aria-label="分類"></select>
    <select id="f-owner" aria-label="担当者"></select>
    <select id="f-next" aria-label="次の対応カテゴリ"></select>
    <select id="f-flag" aria-label="注意"></select>
    <input type="search" id="f-q" placeholder="ID・顧客・内容で検索" aria-label="検索">
    <button id="reset">条件をクリア</button>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap"><table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</section>
</div>
<div id="tip"></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const d10=s=>(s||"").slice(0,10);
const uniq=k=>[...new Set(RAW.map(r=>r[k]).filter(Boolean))];
const CATS=uniq("問い合わせ分類"), OWNERS=uniq("担当者");

let base=todayStr();
let F={status:"open",cat:"",owner:"",next:"",flag:"",q:""};
let sort={key:"due",dir:1};

function enrich(){
  RAW.forEach(r=>{
    const open=r["対応状況"]!=="完了";
    const due=d10(r["対応期限"]), nx=d10(r["次回対応予定日"]);
    r._open=open;r._nc=nextCat(r);
    r._f={
      overdue:open&&due&&due<base,
      today:open&&due===base,
      decision:open&&r["判断要否"]==="要",
      noowner:open&&!r["担当者"],
      nextlate:open&&nx&&nx<base&&!(due&&due<base)
    };
  });
}
function match(r,skip){
  if(skip!=="status"){
    if(F.status==="open"&&!r._open)return false;
    if(F.status&&F.status!=="open"&&F.status!=="all"&&r["対応状況"]!==F.status)return false;
  }
  if(skip!=="cat"&&F.cat&&r["問い合わせ分類"]!==F.cat)return false;
  if(skip!=="owner"&&F.owner&&(F.owner==="(未設定)"?r["担当者"]:r["担当者"]!==F.owner))return false;
  if(skip!=="next"&&F.next&&r._nc!==F.next)return false;
  if(skip!=="flag"&&F.flag&&!r._f[F.flag])return false;
  if(F.q){const t=[r["問い合わせID"],r["顧客名"],r["問い合わせ内容"],r["次の対応"]].join(" ").toLowerCase();if(!t.includes(F.q.toLowerCase()))return false}
  return true;
}

/* ---------- KPI ---------- */
function renderKpis(){
  const c=k=>RAW.filter(r=>r._f[k]).length;
  const items=[
    {l:"総件数",v:RAW.length,n:"全期間",set:{status:"all",flag:""}},
    {l:"未完了",v:RAW.filter(r=>r._open).length,n:"完了以外",set:{status:"open",flag:""}},
    {l:"期限超過",v:c("overdue"),n:"未完了で期限が基準日より前",set:{status:"open",flag:"overdue"},alert:1},
    {l:"本日期限",v:c("today"),n:"未完了で期限が基準日",set:{status:"open",flag:"today"}},
    {l:"判断待ち",v:c("decision"),n:"管理職の判断が必要",set:{status:"open",flag:"decision"},alert:1},
    {l:"担当未設定",v:c("noowner"),n:"未完了で担当者なし",set:{status:"open",flag:"noowner"},alert:1},
    {l:"次回対応が遅れ",v:c("nextlate"),n:"次回予定日を過ぎている",set:{status:"open",flag:"nextlate"}},
    {l:"完了",v:RAW.filter(r=>!r._open).length,n:"完了済み",set:{status:"完了",flag:""}},
  ];
  $("kpis").innerHTML=items.map((it,i)=>{
    const on=Object.entries(it.set).every(([k,v])=>F[k]===v);
    return `<button class="kpi${it.alert&&it.v?" alert":""}" data-i="${i}" aria-pressed="${on}"><div class="l">${it.l}</div><div class="v">${it.v}</div><div class="n">${it.n}</div></button>`}).join("");
  $("kpis").querySelectorAll(".kpi").forEach(b=>b.onclick=()=>{Object.assign(F,{cat:"",owner:"",next:"",q:""},items[b.dataset.i].set);$("f-q").value="";sync()});
}

/* ---------- Charts ---------- */
function bar(counts,w){
  return `<div class="bar">`+STATUSES.filter(([s])=>counts[s]).map(([s,c])=>
    `<div class="seg s-${c}" style="flex:${counts[s]} 1 0" data-tip="${esc(s)}：${counts[s]}件">${counts[s]}</div>`).join("")+`</div>`;
}
function rows(el,key,names,fk,src=RAW){
  const max=Math.max(...names.map(n=>src.filter(r=>(r[key]||"(未設定)")===n).length));
  $(el).innerHTML=names.map(n=>{
    const sub=src.filter(r=>(r[key]||"(未設定)")===n);
    const cnt={};sub.forEach(r=>cnt[r["対応状況"]]=(cnt[r["対応状況"]]||0)+1);
    return `<div class="brow${F[fk]===n?" sel":""}" data-v="${esc(n)}" tabindex="0" role="button" aria-label="${esc(n)} ${sub.length}件"><span class="name" title="${esc(n)}">${esc(n)}</span><div style="width:${sub.length/max*100}%">${bar(cnt)}</div><span class="tot">${sub.length}</span></div>`}).join("");
  $(el).querySelectorAll(".brow").forEach(b=>{
    const go=()=>{F[fk]=F[fk]===b.dataset.v?"":b.dataset.v;if(fk!=="next"&&F.status==="open")F.status="all";sync()};
    b.onclick=go;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });
}
function renderCharts(){
  const cnt={};RAW.forEach(r=>cnt[r["対応状況"]]=(cnt[r["対応状況"]]||0)+1);
  $("total-bar").innerHTML=STATUSES.map(([s,c])=>`<div class="seg s-${c}" style="flex:${cnt[s]||0} 1 0;cursor:pointer" data-s="${s}" data-tip="${s}：${cnt[s]||0}件（${((cnt[s]||0)/RAW.length*100).toFixed(0)}%）">${cnt[s]||0}</div>`).join("");
  $("total-bar").querySelectorAll(".seg").forEach(e=>e.onclick=()=>{F.status=F.status===e.dataset.s?"all":e.dataset.s;F.flag="";sync()});
  $("legend").innerHTML=STATUSES.map(([s,c])=>`<span><i class="s-${c}"></i>${s} ${cnt[s]||0}件</span>`).join("");
  const byCount=(key,list)=>[...list].sort((a,b)=>RAW.filter(r=>(r[key]||"(未設定)")===b).length-RAW.filter(r=>(r[key]||"(未設定)")===a).length);
  rows("chart-cat","問い合わせ分類",byCount("問い合わせ分類",CATS),"cat");
  const ow=[...OWNERS];if(RAW.some(r=>!r["担当者"]))ow.push("(未設定)");
  rows("chart-owner","担当者",byCount("担当者",ow),"owner");
  const openRows=RAW.filter(r=>r._open);
  rows("chart-next","_nc",NEXT_CATS.map(c=>c.n).filter(n=>openRows.some(r=>r._nc===n)),"next",openRows);
}

/* ---------- Table ---------- */
const COLS=[
  ["id","ID",r=>r["問い合わせID"]],["recv","問い合わせ日",r=>d10(r["問い合わせ日時"])],["cust","顧客",r=>r["顧客名"]],
  ["cat","分類",r=>r["問い合わせ分類"]],["body","内容",r=>r["問い合わせ内容"]],["owner","担当者",r=>r["担当者"]||"￿"],
  ["status","状況",r=>STATUSES.findIndex(s=>s[0]===r["対応状況"])],["due","対応期限",r=>d10(r["対応期限"])],
  ["next","次の対応",r=>r._nc?String(NCI[r._nc]).padStart(2,"0")+(r["次の対応"]||""):"￿"],["nextd","次回予定日",r=>d10(r["次回対応予定日"])||"￿"],["flags","注意",r=>Object.keys(FLAGS).filter(k=>r._f[k]).length*-1]
];
function renderHead(){
  $("thead").innerHTML=COLS.map(([k,l])=>`<th data-k="${k}" aria-sort="${sort.key===k?(sort.dir>0?"ascending":"descending"):"none"}">${l}</th>`).join("");
  $("thead").querySelectorAll("th").forEach(th=>th.onclick=()=>{sort=sort.key===th.dataset.k?{key:sort.key,dir:-sort.dir}:{key:th.dataset.k,dir:1};renderHead();renderTable()});
}
const open=new Set();
function renderTable(){
  const list=RAW.filter(r=>match(r));
  const col=COLS.find(c=>c[0]===sort.key)[2];
  list.sort((a,b)=>{const x=col(a),y=col(b);return (x<y?-1:x>y?1:0)*sort.dir||(a["問い合わせID"]<b["問い合わせID"]?-1:1)});
  $("count").textContent=`${list.length} 件を表示`;
  if(!list.length){$("tbody").innerHTML=`<tr><td colspan="${COLS.length}" class="empty">条件に合う案件はありません</td></tr>`;return}
  $("tbody").innerHTML=list.map(r=>{
    const id=r["問い合わせID"],s=SCLS[r["対応状況"]];
    const fl=[];
    if(r._f.overdue)fl.push(`<span class="flag f-crit">期限超過</span>`);
    if(r._f.today)fl.push(`<span class="flag f-warn">本日期限</span>`);
    if(r._f.decision)fl.push(`<span class="flag f-warn">判断待ち</span>`);
    if(r._f.noowner)fl.push(`<span class="flag f-crit">担当未設定</span>`);
    if(r._f.nextlate)fl.push(`<span class="flag f-info">次回対応が遅れ</span>`);
    const due=d10(r["対応期限"]);
    let h=`<tr class="main" data-id="${id}"><td>${id}</td><td>${d10(r["問い合わせ日時"])}</td><td>${esc(r["顧客名"])}</td><td>${esc(r["問い合わせ分類"])}</td><td>${esc(r["問い合わせ内容"])}</td>
      <td>${r["担当者"]?esc(r["担当者"]):'<span class="muted">未設定</span>'}</td>
      <td><span class="badge s-${s}">${r["対応状況"]}</span></td>
      <td class="${r._f.overdue?"late":""}">${due}</td>
      <td>${r._nc?`<span class="ncat p${NEXT_CATS[NCI[r._nc]].p}">${esc(r._nc)}</span>`:""}${r["次の対応"]?esc(r["次の対応"]):'<span class="muted">—</span>'}</td>
      <td class="${r._f.nextlate?"late":""}">${d10(r["次回対応予定日"])||'<span class="muted">—</span>'}</td>
      <td>${fl.join("")||'<span class="muted">—</span>'}</td></tr>`;
    if(open.has(id))h+=`<tr class="detail"><td colspan="${COLS.length}"><dl>
      <dt>問い合わせ日時</dt><dd>${esc(r["問い合わせ日時"])}</dd>
      <dt>判断要否</dt><dd>${esc(r["判断要否"])}${r["判断事項"]?"：":""}${esc(r["判断事項"])}</dd>
      <dt>最終更新日時</dt><dd>${esc(r["最終更新日時"])}</dd>
      <dt>完了日時</dt><dd>${esc(r["完了日時"])||"—"}</dd></dl></td></tr>`;
    return h}).join("");
  $("tbody").querySelectorAll("tr.main").forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;open.has(id)?open.delete(id):open.add(id);renderTable()});
}

/* ---------- Filters ---------- */
function fillSelects(){
  const opt=(v,l)=>`<option value="${esc(v)}">${esc(l)}</option>`;
  $("f-status").innerHTML=opt("open","状況：未完了")+opt("all","状況：すべて")+STATUSES.map(([s])=>opt(s,"状況："+s)).join("");
  $("f-cat").innerHTML=opt("","分類：すべて")+CATS.map(c=>opt(c,c)).join("");
  $("f-owner").innerHTML=opt("","担当者：すべて")+OWNERS.map(c=>opt(c,c)).join("")+opt("(未設定)","担当者：未設定");
  $("f-next").innerHTML=opt("","次の対応：すべて")+NEXT_CATS.map(c=>opt(c.n,"次の対応："+c.n)).join("");
  $("f-flag").innerHTML=opt("","注意：すべて")+Object.entries(FLAGS).map(([k,l])=>opt(k,"注意："+l)).join("");
}
function sync(){
  $("f-status").value=F.status;$("f-cat").value=F.cat;$("f-owner").value=F.owner;$("f-next").value=F.next;$("f-flag").value=F.flag;
  renderKpis();renderCharts();renderTable();
}
[["f-status","status"],["f-cat","cat"],["f-owner","owner"],["f-next","next"],["f-flag","flag"]].forEach(([id,k])=>$(id).onchange=e=>{F[k]=e.target.value;sync()});
$("f-q").oninput=e=>{F.q=e.target.value.trim();renderTable()};
$("reset").onclick=()=>{F={status:"open",cat:"",owner:"",next:"",flag:"",q:""};$("f-q").value="";sync()};
$("base").onchange=e=>{base=e.target.value||todayStr();enrich();sync()};
$("today").onclick=()=>{base=todayStr();$("base").value=base;enrich();sync()};

/* tooltip */
const tip=$("tip");
document.addEventListener("mousemove",e=>{
  const t=e.target.closest&&e.target.closest("[data-tip]");
  if(!t){tip.style.display="none";return}
  tip.textContent=t.dataset.tip;tip.style.display="block";
  tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14)+"px";
});

$("n-all").textContent=RAW.length;
$("base").value=base;
enrich();fillSelects();renderHead();sync();
</script>
</body>
</html>
